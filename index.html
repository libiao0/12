<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>日期数字计算</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, monospace;
    min-height: 100vh;
    overflow:hidden;
}

.bg-layer {
    position:fixed;
    z-index:-2;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
}

/*14种差异明显的浅色系，冷暖青紫蓝灰区分开*/
.bg0 { background:#f7f3ef; }
.bg1 { background:#eef4f9; }
.bg2 { background:#edf7f2; }
.bg3 { background:#f9efee; }
.bg4 { background:#f2eef8; }
.bg5 { background:#f8eef2; }
.bg6 { background:#ebf4f8; }
.bg7 { background:#f8f2e6; }
.bg8 { background:#ececec; }
.bg9 { background:#e9f1f7; }
.bg10 { background:#f9ede4; }
.bg11 { background:#f0edf5; }
.bg12 { background:#eaf2f0; }
.bg13 { background:#f6f0f0; }

.marquee-wrap{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,0.07);
  border:1px solid rgba(0,0,0,0.11);
  padding:8px 0;
  position: fixed;
  top:0;
  left:0;
  z-index:10;
}
.marquee-text{
  display:inline-block;
  white-space: nowrap;
  color:#222831;
  font-weight:500;
  animation: marquee 18s linear infinite;
}
@keyframes marquee {
  0%{transform: translateX(100vw);}
  100%{transform: translateX(-100%);}
}

.drag-window{
    position:absolute;
    width:100%;
    max-width:420px;
    border-radius:16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .09);
    overflow:hidden;
    z-index:10;
    cursor:move;
    user-select:none;
}
.drag-content{
    background: rgba(255,255,255,0.96);
    padding: 32px 24px;
    text-align: center;
}

.title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    min-height:28px;
    background: linear-gradient(90deg,#d62828,#f77f00,#0096c7,#7209b7);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientFlow 4s linear infinite;
}
@keyframes gradientFlow {
  0% {background-position:0% 50%;}
  100% {background-position:300% 50%;}
}

.result-label {
    display:none;
}

.result-value {
    font-size: 48px;
    color: #c81010;
    font-weight: 800;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 20px;
}

.footer {
    display:none;
}

.secret-trigger{
    width:60px;
    height:20px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:0px;
    cursor:pointer;
    background:transparent;
}

.modal-mask{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(0,0,0,0.45);
    z-index:10000;
    display:none;
    justify-content:center;
    align-items:center;
}
.modal-box{
    background:#ffffff;
    padding:26px 24px;
    border-radius:12px;
    width:90%;
    max-width:420px;
}
.modal-box p{
    margin-bottom:14px;
    font-size:15px;
    white-space:pre-line;
}
.modal-btn-group{
    display:flex;
    gap:10px;
    margin-bottom:12px;
}
.modal-btn-group button{
    flex:1;
    padding:9px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}
.btn-ok{background:#2563eb;color:#fff;}
.btn-cancel{background:#e5e7eb;color:#333;}

.color-palette{
    display:grid;
    grid-template-columns: repeat(8,1fr);
    gap:5px;
    margin:10px 0;
}
.color-item{
    height:32px;
    border-radius:4px;
    cursor:pointer;
    border:1px solid #999;
}
.hex-show{
    font-family:Consolas;
    font-size:17px;
    text-align:center;
    padding:8px;
    background:#f4f4f4;
    border-radius:6px;
    margin-top:8px;
}
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>

<div class="marquee-wrap">
  <div class="marquee-text">🔴 此为宇宙无敌炒鸡帅的米饭依旧一小碗维护 禁止传播 🔴</div>
</div>

<div class="drag-window" id="dragWin">
    <div class="drag-content">
        <div class="title" id="titleDom"></div>
        <div class="result-label">今日补偿密码</div>
        <div class="result-value" id="out"></div>
        <div class="footer">
当前设备日期自动计算&nbsp;&nbsp;|&nbsp;&nbsp;总访问：<span id="busuanzi_value_site_pv"></span><span id="customPvShow"></span>次
        </div>
        <div class="secret-trigger" onclick="openEditModal()"></div>
    </div>
</div>

<div class="modal-mask" id="mask">
    <div class="modal-box">
        <p id="modalTip">🔒请输入访问权限密码</p >
        <input id="modalInput" type="password" autocomplete="off">
        <div class="modal-btn-group">
            <button class="btn-ok" onclick="modalConfirm()">确定</button>
            <button class="btn-cancel" onclick="modalClose()">取消</button>
        </div>

        <div id="colorModule" style="display:none;">
            <p>👇点击下方色块，直接显示16进制色值</p >
            <div class="color-palette" id="paletteBox"></div>
            <div class="hex-show" id="hexOutput">HEX：#------</div>
        </div>
    </div>
</div>

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<script>
//14组风格区分大的背景类
const bgClassList = ["bg0","bg1","bg2","bg3","bg4","bg5","bg6","bg7","bg8","bg9","bg10","bg11","bg12","bg13"];
const bgLayer = document.getElementById("bgLayer");
const randCls = bgClassList[Math.floor(Math.random() * bgClassList.length)];
bgLayer.classList.add(randCls);

//拖拽
const dragWin = document.getElementById("dragWin");
let isDrag = false;
let offsetX, offsetY;
dragWin.style.left = (window.innerWidth - 420) / 2 + "px";
dragWin.style.top = (window.innerHeight - 320) / 2 + "px";

dragWin.addEventListener('mousedown', (e) => {
    isDrag = true;
    offsetX = e.clientX - dragWin.offsetLeft;
    offsetY = e.clientY - dragWin.offsetTop;
    dragWin.style.zIndex = 99;
    e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
    if (!isDrag) return;
    let nx = e.clientX - offsetX;
    let ny = e.clientY - offsetY;
    if (nx < 0) nx = 0;
    if (ny < 30) ny = 30;
    if (nx + dragWin.offsetWidth > window.innerWidth) nx = window.innerWidth - dragWin.offsetWidth;
    if (ny + dragWin.offsetHeight > window.innerHeight) ny = window.innerHeight - dragWin.offsetHeight;
    dragWin.style.left = nx + "px";
    dragWin.style.top = ny + "px";
});

document.addEventListener('mouseup', () => {
    isDrag = false;
});

//色板
const colorList = [
    "#ffffff","#f8f9fa","#dee2e6","#adb5bd","#6c757d","#343a40","#212529","#000000",
    "#ff0000","#ff4444","#ff8888","#ffbbbb","#ff8800","#ffaa44","#ffcc88","#ffeebb",
    "#ffff00","#ffff88","#aaff00","#44ff00","#00ff44","#00ff88","#00ffff","#44ffff",
    "#00bbff","#0088ff","#0044ff","#0000ff","#4400ff","#8800ff","#bb00ff","#ff00ff",
    "#ff44bb","#ff88dd","#d62828","#f77f00","#fcbf49","#eae2b7","#003049","#0096c7",
    "#023e8a","#7209b7","#b5179e","#480ca8","#3a0ca3","#4361ee","#4cc9f0","#e63946",
    "#457b9d","#1d3557","#f1faee","#a8dadc","#2a9d8f","#264653","#e9c46a","#f4a261",
    "#22223b","#4a4e69","#9a8c98","#c9ada7","#f2e9e4","#083d77","#ebebd3","#f79256"
];
const paletteBox = document.getElementById("paletteBox");
const hexOutput = document.getElementById("hexOutput");
colorList.forEach(hex=>{
    const div = document.createElement("div");
    div.className = "color-item";
    div.style.background = hex;
    div.dataset.hex = hex.toUpperCase();
    div.onclick = function(){
        hexOutput.innerText = "HEX：" + this.dataset.hex;
    }
    paletteBox.appendChild(div);
})

//逐字打字动画
const titleText = "今日补偿密码";
const titleDom = document.getElementById('titleDom');

async function typeEffect(){
    titleDom.innerText = "";
    for(let i=0;i<titleText.length;i++){
        titleDom.innerText = titleText.substring(0,i+1);
        await sleep(180);
    }
    await sleep(30000);
    for(let i=0;i<titleText.length;i++){
        titleDom.innerText = titleDom.innerText.substring(1);
        await sleep(180);
    }
    await sleep(1000);
    typeEffect();
}
function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}
typeEffect();

//密码计算
function getShortCode(d){
    const y = String(d.getFullYear()).slice(-2);
    const m = d.getMonth()+1;
    const day = d.getDate();
    return Number(y + "" + m + "" + day);
}

const now = new Date();
const yesterday = new Date(now);
yesterday.setDate(now.getDate()-1);

const todayCode = getShortCode(now);
const yestCode = getShortCode(yesterday);
const plus3Code = todayCode + 3;

const total = BigInt(todayCode) * BigInt(yestCode) * BigInt(plus3Code);
const last8 = total % 100000000n;
document.getElementById("out").innerText = last8.toString();

//点击烟花
document.addEventListener('click',e=>{
  for(let i=0;i<12;i++){
    const fire = document.createElement('div');
    const angle = (i/12)*Math.PI*2;
    const x = e.clientX, y=e.clientY;
    fire.style.cssText = `position:fixed;width:8px;height:8px;border-radius:50%;background:${['#ff0000','#ffaa00','#0088ff','#ff2288'][Math.floor(Math.random()*4)]};left:${x}px;top:${y}px;pointer-events:none;z-index:9999;`;
    document.body.appendChild(fire);
    let step=0;
    const move = setInterval(()=>{
      step++;
      fire.style.left = `${x+Math.cos(angle)*step*3}px`;
      fire.style.top = `${y+Math.sin(angle)*step*3}px`;
      fire.style.opacity = 1-step/30;
      if(step>30){clearInterval(move);fire.remove()}
    },20)
  }
})

//访问统计弹窗
let customShowNum = null;
const customPvShow = document.getElementById("customPvShow");
const mask = document.getElementById('mask');
const modalInput = document.getElementById('modalInput');
const modalTip = document.getElementById('modalTip');
const colorModule = document.getElementById("colorModule");
let modalStage = 0;
let realPvValue = "";

function openEditModal(){
    modalStage = 0;
    modalTip.innerText = "🔒请输入访问权限密码";
    modalInput.value = "";
    modalInput.type = "password";
    colorModule.style.display="none";
    hexOutput.innerText = "HEX：#------";
    mask.style.display = "flex";
    modalInput.focus();
}
function modalClose(){
    mask.style.display = "none";
}
function modalConfirm(){
    const val = modalInput.value.trim();
    if(modalStage===0){
        if(val !== "123456"){
            alert("❌密码错误！");
            modalClose();
            return;
        }
        realPvValue = document.getElementById('busuanzi_value_site_pv').innerText || "获取中";
        modalStage =1;
        modalTip.innerText = `✅真实总访问：${realPvValue}\n如需修改页面显示数字，请输入，留空则跳过\n点击色板色块读取十六进制`;
        modalInput.value = "";
        modalInput.type="text";
        colorModule.style.display="block";
        modalInput.focus();
    }else if(modalStage===1){
        if(val!==""){
            customShowNum = val;
            customPvShow.innerText = "【手动:"+customShowNum+"】";
        }
        modalClose();
    }
}
document.getElementById('modalInput').addEventListener('keydown',e=>{
    if(e.key==='Enter') modalConfirm();
})
</script>

</body>
</html>
