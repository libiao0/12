<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>日期数字计算</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    padding: 20px;
}

.card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 32px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    text-align: center;
}

.title {
    font-size: 22px;
    color: #1f2329;
    margin-bottom: 24px;
    font-weight: 600;
    min-height:28px;
}

.result-label {
    display:none;
}

.result-value {
    font-size: 48px;
    color: #c81010;
    font-weight: 800;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 20px;
}

.footer {
    margin-top: 24px;
    font-size: 13px;
    color: #9ca3af;
}
</style>
</head>
<body>

<div class="card">
    <div class="title" id="titleDom"></div>

    <div class="result-label">今日补偿密码</div>
    <div class="result-value" id="out"></div>

    <div class="footer">
当前设备日期自动计算&nbsp;&nbsp;|&nbsp;&nbsp;总访问：<span id="busuanzi_value_site_pv"></span>次
    </div>
</div>

<!--不蒜子访问统计，无需注册账号-->
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<script>
const titleText = "今日补偿密码";
const titleDom = document.getElementById('titleDom');

async function typeEffect(){
    titleDom.innerText = "";
    for(let i=0;i<titleText.length;i++){
        titleDom.innerText = titleText.substring(0,i+1);
        await sleep(180);
    }
    await sleep(3000);
    for(let i=0;i<titleText.length;i++){
        titleDom.innerText = titleText.substring(i+1);
        await sleep(180);
    }
    await sleep(600);
    typeEffect();
}

function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}
typeEffect();

//密码计算逻辑
function getShortCode(d){
    const y = String(d.getFullYear()).slice(-2);
    const m = d.getMonth()+1;
    const day = d.getDate();
    return Number(y + "" + m + "" + day);
}

const now = new Date();
const yesterday = new Date(now);
yesterday.setDate(now.getDate()-1);

const todayCode = getShortCode(now);
const yestCode = getShortCode(yesterday);
const plus3Code = todayCode + 3;

const total = BigInt(todayCode) * BigInt(yestCode) * BigInt(plus3Code);
const last8 = total % 100000000n;

document.getElementById('out').innerText = last8.toString();
</script>

</body>
</html>
